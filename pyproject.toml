[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[project]
name = "slyme"
dynamic = ["version"]
description = "Slyme is a highly composable functional execution framework."
readme = "README.md"
authors = [{ name = "The SlymeLab Team" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = [
    "typing-extensions>=4.0.0",
]

[project.scripts]
slyme = "slyme.__main__:main"

[project.urls]
Homepage = "https://github.com/slymelab/slyme"
Documentation = "https://slymelab.github.io/slyme/"
Repository = "https://github.com/slymelab/slyme.git"
Issues = "https://github.com/slymelab/slyme/issues"
Changelog = "https://github.com/slymelab/slyme/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/slyme"]

[dependency-groups]
test = [
    "hypothesis>=6.140,<7",
    "pytest>=8.4,<9; python_version < '3.10'",
    "pytest>=9,<10; python_version >= '3.10'",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
]
lint = [
    "ruff>=0.16,<0.17",
]
types = [
    "mypy>=1.18,<2",
]
build = [
    "build>=1.3,<2",
    "twine>=6.2,<7",
]
dev = [
    { include-group = "build" },
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "types" },
    "pre-commit>=4.3,<5",
]

[tool.pytest.ini_options]
minversion = "8.4"
addopts = [
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-ra",
    "--cov=slyme",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
xfail_strict = true
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore:^slyme\\.runner, slyme\\.cli\\.command, and the slyme command-line entry point:FutureWarning",
]

[tool.coverage.run]
branch = true
source = ["slyme"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.9"
files = ["src/slyme"]
check_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
plugins = []

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["E402", "E741"]
"tests/**/*.py" = ["B008", "B018"]
