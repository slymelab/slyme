name: Bug report
description: Report reproducible incorrect behavior in Slyme.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Slyme. Do not report security issues here.
  - type: input
    id: version
    attributes:
      label: Slyme version
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and platform
      placeholder: "Python 3.13.5 on Linux"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest runnable example that demonstrates the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report does not contain secrets or sensitive data.
          required: true
